name: Product feedback or ordinary bug
description: Suggest an improvement or describe a problem using invented information.
body:
  - type: markdown
    attributes:
      value: For a security or clinical-safety concern, use [private reporting](https://github.com/ctlplne/healthctl/security/advisories/new). Use only fictional details in either channel.
  - type: input
    id: version
    attributes:
      label: Version or commit and installation method
      placeholder: For example, source checkout or Mac launcher
  - type: textarea
    id: description
    attributes:
      label: What happened or could work better?
      description: Describe any steps, expected result and observed result with made-up inputs.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe to publish
      options:
        - label: I have left out health records, recordings, screenshots of real encounters and credentials.
          required: true
