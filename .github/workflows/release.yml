name: Prepare release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version and main history
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./web/package.json').version")"

  test:
    needs: tag
    uses: ./.github/workflows/ci.yml
  qualify:
    needs: tag
    uses: ./.github/workflows/qualification.yml

  sign_mac:
    name: Sign and notarize the tested Mac installer
    needs: [test, qualify]
    if: vars.HEALTHCTL_MACOS_SIGNING == 'true'
    environment: macos-signing
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-arm64-adhoc
          path: build/qualified
      - name: Apply Developer ID and obtain Apple's notarization ticket
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: ./scripts/sign-desktop-ci.sh build/qualified/healthctl-arm64.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64-notarized
          path: build/desktop/healthctl-arm64.dmg
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  draft:
    name: Attest tested archives and prepare draft
    needs: [test, qualify, sign_mac]
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.qualify.result == 'success' &&
      (needs.sign_mac.result == 'success' || needs.sign_mac.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - if: needs.sign_mac.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-arm64-notarized
          path: dist
      - name: Generate checksums for tested release artifacts
        working-directory: dist
        run: |
          files=(healthctl-linux-amd64.tar.gz healthctl-linux-arm64.tar.gz)
          if [[ -f healthctl-arm64.dmg ]]; then files+=(healthctl-arm64.dmg); fi
          sha256sum "${files[@]}" > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Stage the release for the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > "$RUNNER_TEMP/draft-state"; then
            test "$(cat "$RUNNER_TEMP/draft-state")" = true
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --generate-notes --title "healthctl $GITHUB_REF_NAME"
          fi
