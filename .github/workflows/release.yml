name: Prepare release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version and main history
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./web/package.json').version")"

  test:
    needs: tag
    uses: ./.github/workflows/ci.yml
  qualify:
    needs: tag
    uses: ./.github/workflows/qualification.yml

  draft:
    name: Attest tested archives and prepare draft
    needs: [test, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - name: Generate checksums for both architectures
        working-directory: dist
        run: sha256sum healthctl-linux-amd64.tar.gz healthctl-linux-arm64.tar.gz > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Stage the release for the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > "$RUNNER_TEMP/draft-state"; then
            test "$(cat "$RUNNER_TEMP/draft-state")" = true
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --generate-notes --title "healthctl $GITHUB_REF_NAME"
          fi
