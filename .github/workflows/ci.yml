name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  software:
    strategy:
      fail-fast: false
      matrix:
        suite: [backend, browser]
    name: ${{ matrix.suite }} verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/init.py
      - run: python3 scripts/verify.py "${{ matrix.suite }}"
      - name: Save synthetic browser screenshots on failure
        if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-browser-failures
          path: build/test-results/**/test-failed-*.png
          if-no-files-found: ignore
          retention-days: 7

  evaluation:
    name: Synthetic case regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target evaluator -t healthctl-evaluator .
      - name: Run the offline benchmark
        run: docker run --rm --network none --read-only --tmpfs /tmp healthctl-evaluator -release > "$RUNNER_TEMP/scorecard.json"
      - name: Report individual cases and compare history capture
        if: '!cancelled()'
        run: python3 scripts/check_scorecard.py --drift "$RUNNER_TEMP/scorecard.json" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      - name: Save the per-case scorecard
        if: '!cancelled()'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-scorecard
          path: ${{ runner.temp }}/scorecard.json
          retention-days: 7

  safety:
    name: Safety corpus, input paths and invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target server -t healthctl-server .
      - name: Run the corpus, every input path and the random-action invariants
        run: docker run --rm --network none healthctl-server go test -count=1 -v -run 'TestCorpus|TestEveryInputPathScreens|TestRandomActionInvariants|TestContextEngineScopesEachCue' ./internal/clinical | tee "$RUNNER_TEMP/safety.txt"
        shell: bash
      - name: Report safety metrics
        if: '!cancelled()'
        run: grep -E '^(CORPUS|HOLDOUT|PROPERTY)' "$RUNNER_TEMP/safety.txt" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      - name: Run the web unit tests
        run: docker build --target ui-test .

  dependencies:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target server -t healthctl-server .
      - name: Scan Go modules with govulncheck
        run: docker run --rm healthctl-server sh -c 'go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/... ./internal/... ./evaluation/...'
      - name: Audit web dependencies
        run: docker run --rm --entrypoint sh "$(docker build -q --target ui .)" -c 'cd /ui && npm audit --audit-level=high'

  docs:
    name: Documentation and study checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_docs.py
      - run: python3 -m unittest discover -s evaluation/study -v
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
