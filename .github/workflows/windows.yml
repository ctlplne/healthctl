name: Windows launcher
on:
  push:
    branches: [main]
    tags: ['windows-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build and open Windows x64 launcher
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python scripts/build-windows.py
      - run: python scripts/verify-windows.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: build/windows/
          if-no-files-found: error

  journey:
    name: Run the Windows package against Linux containers
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: build/windows
      - name: Install the CLR for the service integration drill
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y mono-runtime libmono-system-windows-forms4.0-cil
      - run: python3 scripts/verify-windows.py

  release-checks:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/windows-')
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified Windows beta
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/windows-')
    needs: [journey, release-checks]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: build/windows
      - name: Release the exact tested files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^windows-([0-9]+\.[0-9]+\.[0-9]+)-beta\.[0-9]+$ ]]
          test "${BASH_REMATCH[1]}" = "$(node -p "require('./web/package.json').version")"
          git merge-base --is-ancestor HEAD origin/main
          cd build/windows
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "healthctl ${GITHUB_REF_NAME#windows-} for Windows x64 (unsigned)" \
            --notes-file ../../desktop/windows/release-notes.md \
            healthctl-windows-x64.exe healthctl-windows-x64.spdx.json SHA256SUMS
