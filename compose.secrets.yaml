# Pass the installation key and database password to the read-only app and
# backup containers as files, so they never appear in container configuration.
# Create the files once with: python3 scripts/secret_files.py
# Then start with: docker compose -f compose.yaml -f compose.secrets.yaml up -d
services:
  app:
    environment:
      CLINICAL_DATA_KEY: ""
      PGPASSWORD: ""
      CLINICAL_DATA_KEY_FILE: /run/secrets/clinical_data_key_file
      PGPASSWORD_FILE: /run/secrets/database_password_file
    secrets: [clinical_data_key_file, database_password_file]
  backup:
    environment:
      PGPASSWORD: ""
      PGPASSWORD_FILE: /run/secrets/database_password_file
    secrets: [database_password_file]
secrets:
  clinical_data_key_file:
    file: ./.secrets/clinical_data_key
  database_password_file:
    file: ./.secrets/database_password
